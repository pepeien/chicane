name: Documentation
on:
    push:
        branches: [master]
        paths:
            - 'Includes/Chicane/**.hpp'
            - 'Scripts/Documentation/Helper.py'
            - 'Doxyfile'
    workflow_dispatch:
concurrency:
    group: master-bots
    cancel-in-progress: false
jobs:
    build:
        runs-on: ubuntu-22.04
        permissions:
            contents: write
        defaults:
            run:
                working-directory: ./Scripts
        steps:
            - name: Setup Checkout
              uses: actions/checkout@v6

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: '3.13'

            - name: Build XML
              uses: mattnotmitt/doxygen-action@1.12.0

            - name: Fix permissions
              run: |
                sudo chown -R $USER:$USER .
                chmod -R 755 .

            - name: Cleanup References
              working-directory: .
              run: rm -rf .docs/references

            - name: Build References
              run: bash Documentation.sh

            - name: Rebase onto master
              working-directory: .
              run: |
                git fetch origin master
                git pull --rebase --autostash origin master

            - name: Commit
              uses: stefanzweifel/git-auto-commit-action@v7
              with:
                commit_message: 'docs: Updated documentation'
                file_pattern: '.docs/**/*.json'
                skip_fetch: true
                skip_checkout: true
